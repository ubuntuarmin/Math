<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checking your position in line… | Math Katy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    #spotContent {
      max-width: 540px;
      width: 100%;
      text-align: center;
    }
    .sp-spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 1.4rem;
      animation: sp-spin 0.9s linear infinite;
    }
    @keyframes sp-spin { to { transform: rotate(360deg); } }
    .sp-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.35rem;
      letter-spacing: 0.01em;
    }
    .sp-sub {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 1.6rem;
    }
    .sp-featured {
      display: block;
      font-size: 1.05rem;
      color: #e2e8f0;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }
    .sp-promo-link { color: #38bdf8; text-decoration: underline; }
  </style>
    <script src="analytics.js" defer></script>
</head>
<body>
  <div id="spotContent">
    <div class="sp-spinner"></div>
    <h1 class="sp-title">Checking your position in line…</h1>
    <p class="sp-sub">Your experience is loading. This only takes a moment.</p>
    <p class="sp-featured">Advertise here for free! <a href="promote.html" target="_top" class="sp-promo-link">→ promote.html</a>.</p>
  </div>
</body>
</html>
