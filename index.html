<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katy Math — Down</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #ef4444;
      --red-glow: rgba(239,68,68,0.55);
      --bg: #050810;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #f1f5f9;
    }

    /* Animated radial background */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(239,68,68,0.18), transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(124,58,237,0.14), transparent 65%),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(59,130,246,0.10), transparent 60%);
      animation: bg-drift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes bg-drift {
      from { transform: scale(1) rotate(0deg); }
      to   { transform: scale(1.08) rotate(3deg); }
    }

    /* Card wrapper — starts invisible, animates in over ~5 s */
    .card {
      position: relative;
      text-align: center;
      padding: 3.5rem 4rem;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(15,20,40,0.9), rgba(8,12,28,0.95));
      border: 1px solid rgba(239,68,68,0.25);
      box-shadow:
        0 0 0 1px rgba(239,68,68,0.12),
        0 32px 80px rgba(0,0,0,0.7),
        0 0 60px rgba(239,68,68,0.12);
      max-width: 680px;
      width: 90vw;

      /* — 5-second entrance animation — */
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      animation: card-enter 5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes card-enter {
      0%   { opacity: 0; transform: translateY(40px) scale(0.92); }
      30%  { opacity: 1; transform: translateY(-6px) scale(1.02); }
      60%  { transform: translateY(4px) scale(0.99); }
      80%  { transform: translateY(-2px) scale(1.005); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glowing border sweep */
    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(239,68,68,0.7) 25%,
        transparent 50%
      );
      animation: border-spin 4s linear infinite;
      opacity: 0.45;
      pointer-events: none;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      padding: 2px;
    }

    @keyframes border-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Icon */
    .icon {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 1.5rem;
      display: block;
      filter: drop-shadow(0 0 18px rgba(239,68,68,0.7));
      animation: icon-pulse 2.4s ease-in-out infinite;
    }

    @keyframes icon-pulse {
      0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 18px rgba(239,68,68,0.7)); }
      50%       { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(239,68,68,0.95)); }
    }

    /* Heading */
    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: linear-gradient(135deg, #f87171 0%, #ef4444 50%, #dc2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 1rem;
    }

    /* Sub-text */
    p {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: #94a3b8;
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto 2rem;
    }

    /* Status pill */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: dot-blink 1.2s ease-in-out infinite;
    }

    @keyframes dot-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🚫</span>
    <h1>Katy Math is Down</h1>
    <p>This site is currently unavailable because it is a bad site.</p>
    <div class="status">
      <span class="status-dot"></span>
      Service Offline
    </div>
  </div>
</body>
</html>
