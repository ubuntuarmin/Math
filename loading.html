<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #renderCanvas {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }

    /* ── Custom pre-loader overlay ───────────────────────────── */
    #preLoader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      transition: opacity 0.7s ease;
    }
    #preLoader.pl-fade-out {
      opacity: 0;
      pointer-events: none;
    }
    /* Fallback content shown until spot file is fetched */
    .pl-fallback {
      text-align: center;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    .pl-fallback .pl-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(56,189,248,0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: pl-spin 0.9s linear infinite;
    }
    .pl-fallback h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f1f5f9;
      margin: 0 0 0.4rem;
    }
    .pl-fallback p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0;
    }
    @keyframes pl-spin {
      to { transform: rotate(360deg); }
    }
    /* ── Spot-file content styles (injected #spotContent uses these) ─── */
    #spotContent {
      max-width: 540px;
      width: 100%;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #e2e8f0;
      padding: 1.5rem;
    }
    .sp-spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      margin: 0 auto 1.4rem;
      animation: pl-spin 0.9s linear infinite;
    }
    .sp-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f1f5f9;
      margin: 0 0 0.35rem;
      letter-spacing: 0.01em;
    }
    .sp-sub {
      font-size: 0.875rem;
      color: #64748b;
      margin: 0 0 1.6rem;
    }
    .sp-card {
      background: linear-gradient(145deg, #0f172a, #060c1e);
      border: 1px solid rgba(56,189,248,0.18);
      border-radius: 16px;
      padding: 1.4rem 1.6rem;
      text-align: left;
      margin-bottom: 1.4rem;
    }
    .sp-card-heading {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #38bdf8;
      margin: 0 0 0.75rem;
    }
    .sp-list {
      list-style: none;
      padding: 0; margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .sp-list li {
      font-size: 0.82rem;
      color: #94a3b8;
      padding-left: 1rem;
      position: relative;
    }
    .sp-list li::before {
      content: "›";
      position: absolute;
      left: 0;
      color: #475569;
    }
    .sp-list li.sp-featured {
      color: #e2e8f0;
      font-weight: 600;
    }
    .sp-list li.sp-featured::before { color: #38bdf8; }
    .sp-cta {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      padding: 0.65rem 1.6rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .sp-cta-note {
      margin-top: 0.6rem;
      font-size: 0.72rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <!-- ── Pre-loader bootstrap (runs before Babylon.js scripts) ── -->
  <script>
    window.__plStart = Date.now();
    // Random delay between 4 000 ms and 6 000 ms
    window.__plDelay = 4000 + Math.random() * 2000;
    // Pick a random spot file 01-20 and start fetching immediately so the
    // download happens in parallel with the heavy Babylon.js script loads.
    var _n  = Math.floor(Math.random() * 20) + 1;
    var _sf = 'spot_' + (_n < 10 ? '0' + _n : '' + _n) + '.html';
    window.__spotFetch = typeof fetch !== 'undefined'
      ? fetch(_sf).then(function(r){ return r.ok ? r.text() : null; }).catch(function(){ return null; })
      : Promise.resolve(null);
  </script>

  <!-- ── Pre-loader overlay (immediately visible while scripts load) ── -->
  <div id="preLoader">
    <div class="pl-fallback">
      <div class="pl-spinner"></div>
      <h2>Checking your position in line…</h2>
      <p>Loading your experience, please wait.</p>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <!-- Babylon.js core + plugins (latest stable from official CDN) -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/addons/babylonjs.addons.min.js"></script>
  <!-- ES-module shims – required for Recast/WASM navigation on Firefox -->
  <script src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <script>
    // Ancient ruins asset : https://sketchfab.com/3d-models/ancient-ruins-5da77fdce0cd46b395cbbdcce7eb17a7
    // by https://sketchfab.com/fedorzabelin
    // Firefly asset : https://sketchfab.com/3d-models/lowpoly-firefly-5effa6605b5545f2915da8b8fff8fa48
    // by https://sketchfab.com/caledhril_01

    function fixMaterials(scene, exclude) {
      scene.materials.forEach(material => {
        material.backFaceCulling = false;
        material.alphaMode = BABYLON.Constants.ALPHA_DISABLE;
        material.transparencyMode = null;
        material.needAlphaBlending = () => false;
        material.needAlphaTesting = () => true;
        material.usePhysicalLightFalloff = false;

        const textures = [
          material.diffuseTexture, material.albedoTexture, material.opacityTexture,
          material.emissiveTexture, material.bumpTexture, material.normalTexture,
          material.metallicTexture, material.roughnessTexture, material.reflectionTexture
        ].filter(Boolean);

        textures.forEach(tex => {
          if (!tex.name.includes("Ground")) {
            tex.updateSamplingMode(BABYLON.Texture.NEAREST_NEAREST);
          }
        });
        // PERFORMANCE OPTIMIZATION: Freeze materials once loaded
        material.freeze();
      });
    }

    async function createNavigationPluginAsync() {
      const isFirefox = navigator.userAgent.includes("Firefox");
      if (!isFirefox) {
        return await ADDONS.CreateNavigationPluginAsync();
      } else {
        const recastVersion = "0.43.0";
        const recastBase = "https://unpkg.com/@recast-navigation";
        importShim.addImportMap({
          imports: {
            "@recast-navigation/core": `${recastBase}/core@${recastVersion}/dist/index.mjs`,
            "@recast-navigation/wasm": `${recastBase}/wasm@${recastVersion}/dist/recast-navigation.wasm-compat.js`,
            "@recast-navigation/generators": `${recastBase}/generators@${recastVersion}/dist/index.mjs`,
          },
        });
        const [core, generators] = await Promise.all([
          importShim(`${recastBase}/core@${recastVersion}/dist/index.mjs`),
          importShim(`${recastBase}/generators@${recastVersion}/dist/index.mjs`),
        ]);
        const recast = { ...core, ...generators };
        await recast.init();
        return await ADDONS.CreateNavigationPluginAsync({ instance: recast });
      }
    }

    const createScene = async function () {
      engine.hideLoadingUI();

      var scene = new BABYLON.Scene(engine);
      scene.clearColor.set(0,0,0,1.);

      var camera = new BABYLON.ArcRotateCamera("camera1", 0, 0.2, 70, new BABYLON.Vector3(0, 1.5, 0), scene);
      camera.lowerBetaLimit = 0.1;
      camera.upperBetaLimit = 1.5;
      camera.lowerRadiusLimit = 6;
      camera.upperRadiusLimit = 70;

      // Try to create the navmesh/crowd navigation plugin; fall back to simple
      // random-walk movement if WASM is unavailable in this browser context.
      let navigationPlugin = null;
      let hasNavMesh = false;
      try {
        navigationPlugin = await createNavigationPluginAsync();
      } catch (navErr) {
        console.warn("[loading.html] Navigation plugin unavailable, using simple movement:", navErr);
      }

      var plane = BABYLON.MeshBuilder.CreateGround("defground", {width: 25, height: 25}, scene);
      plane.position.z = -5; plane.visibility = 0;
      await BABYLON.ImportMeshAsync("assets/ancient_ruins.glb", scene);

      var staticMeshes = [];
      var staticMeshesNav = [];
      scene.meshes.forEach((mesh) => {
        mesh.receiveShadows = true;
        staticMeshes.push(mesh);
        if (mesh.name.includes("defground") ||mesh.name.includes("Ground") || mesh.name.includes("Stones") || mesh.name.includes("Stone_Sculpture_Sculpture_0")) {
          staticMeshesNav.push(mesh);
        }
        // PERFORMANCE OPTIMIZATION: Freeze static environment meshes
        mesh.freezeWorldMatrix();
        mesh.doNotSyncBoundingInfo = true;
      });
      scene.getMeshByName("Ground_Ground_0").scaling.set(2,1,2);

      const source = "assets/env/";
      const files = [`${source}px.png`, `${source}py.png`, `${source}pz.png`, `${source}nx.png`, `${source}ny.png`, `${source}nz.png`];
      var envTexture = BABYLON.CubeTexture.CreateFromImages(files, scene);

      const skydome = BABYLON.MeshBuilder.CreateBox("sky", { size: 1000, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
      skydome.rotation.y = Math.PI; skydome.isPickable = false;
      const sky = new BABYLON.BackgroundMaterial("skyMaterial", scene);
      sky.reflectionTexture = envTexture.clone();
      sky.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
      skydome.material = sky;

      var light00 = new BABYLON.SpotLight("*spot00", new BABYLON.Vector3(0, 12, 8), new BABYLON.Vector3(0, -1, -1), 1.2, 20, scene);
      light00.shadowMinZ = 1; light00.shadowMaxZ = 400; light00.intensity = 4; light00.angle = Math.PI * 0.5; light00.diffuse.set(1,0.5,0.1);

      if (!engine.hostInformation.isMobile) {
        var shadowGenerator = new BABYLON.ShadowGenerator(512, light00);
        shadowGenerator.bias = 0.001; shadowGenerator.normalBias = 0.02;
        shadowGenerator.usePoissonSampling = true; shadowGenerator.setDarkness(0.3);
        staticMeshes.forEach((mesh)=>{ shadowGenerator.getShadowMap().renderList.push(mesh); });
      }

      const maxAgentRadius = 0.15; const AGENT_COUNT = 30; const cellSize = 0.5;
      const SIMPLE_MOVE_ARRIVE_THRESHOLD = 0.1;
      const MIN_TARGET_CHANGE_TIME_MS = 10000;
      const RANDOM_TARGET_CHANGE_RANGE_MS = 2000;

      let crowd = null;
      if (navigationPlugin) {
        try {
          const navmeshParameters = {cs: cellSize, ch: 0.5, walkableRadius: Math.ceil(maxAgentRadius / cellSize), maxObstacles: 0 };
          await navigationPlugin.createNavMeshAsync(staticMeshesNav, navmeshParameters);
          hasNavMesh = true;
          crowd = navigationPlugin.createCrowd(AGENT_COUNT, maxAgentRadius, scene);
        } catch (meshErr) {
          console.warn("[loading.html] NavMesh creation failed, using simple movement:", meshErr);
        }
      }

      fixMaterials(scene, []);
      const agentParams = { radius: 0.5, height: 0.5, maxAcceleration: 4.0, maxSpeed: 2.0, separationWeight: 1.0 };
      // Use ClusteredLightContainer only when the engine supports it (WebGPU needs texelFetch;
      // WebGL 2 additionally needs colorBufferFloat and blendFloat).
      const _caps = engine.getCaps();
      const _clusteredSupported = _caps.texelFetch && (engine.isWebGPU || (_caps.colorBufferFloat && _caps.blendFloat));
      const clustered = _clusteredSupported ? new BABYLON.ClusteredLightContainer("clustered", [], scene) : null;
      var agentDatas = [];
      // Simple-movement fireflies used when navmesh is unavailable
      var simpleFireflies = [];

      var getRandomPos = function() {
        var pickedPoint = new BABYLON.Vector3(Math.random() * 20 - 10, 1, Math.random() * 20 - 10);
        if (hasNavMesh) {
          return navigationPlugin.getClosestPoint(pickedPoint);
        }
        return pickedPoint;
      };

      var randomGoto = function(index) {
        const agents = crowd.getAgents();
        const destination = getRandomPos();
        crowd.agentGoto(agents[index], destination);
        return destination;
      };

      // PERFORMANCE OPTIMIZATION: Drastically reduce the number of dynamic point lights
      const MAX_LIGHTS = 6;

      BABYLON.LoadAssetContainerAsync("assets/firefly.glb", scene).then((container) => {
        container.meshes[0].scaling.scaleInPlace(2);

        for (let i = 0; i < AGENT_COUNT ; i++) {
          const plane2Entries = container.instantiateModelsToScene(undefined, false, { doNotInstantiate: true });
          const firefly = plane2Entries.rootNodes[0]; firefly.position.y = 1.;
          plane2Entries.animationGroups[1].start(true, Math.random() * 0.1 + 0.9);
          let pointLight = null;
          if (i < MAX_LIGHTS) {
            pointLight = new BABYLON.PointLight("point" + i, new BABYLON.Vector3(0,0.1,0), scene);
            pointLight.diffuse = new BABYLON.Color3(1,0.5,0.1); pointLight.range = 2; pointLight.intensity = 8;
            if (clustered) { clustered.addLight(pointLight); } pointLight.parent = firefly;
          }

          const agentTransform = new BABYLON.TransformNode("agentTransform", scene);

          if (hasNavMesh) {
            const agentIndex = crowd.addAgent(getRandomPos(), agentParams, agentTransform);
            firefly.parent = agentTransform;
            agentDatas[i] = {mesh: agentTransform, idx: agentIndex, target: randomGoto(i), light: pointLight, ttc: 0};
          } else {
            // Simple movement fallback: place at random position and drift slowly
            const startPos = getRandomPos();
            agentTransform.position.copyFrom(startPos);
            firefly.parent = agentTransform;
            simpleFireflies.push({
              mesh: agentTransform,
              light: pointLight,
              target: getRandomPos(),
              ttc: Math.random() * RANDOM_TARGET_CHANGE_RANGE_MS + MIN_TARGET_CHANGE_TIME_MS
            });
          }
        }
        container.meshes[0].setEnabled(false);
      });

      const guiTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("LoadingScreenHUD");
      const overlay = new BABYLON.GUI.Rectangle();
      overlay.width = "100%";
      overlay.height = "100%";
      overlay.background = "rgba(0, 0, 0, 0.75)";
      overlay.thickness = 0;
      overlay.alpha = 0;
      guiTexture.addControl(overlay);

      const mainContainer = new BABYLON.GUI.StackPanel();
      mainContainer.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
      mainContainer.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
      overlay.addControl(mainContainer);

      const titleText = new BABYLON.GUI.TextBlock();
      titleText.text = "Math-Katy";
      titleText.color = "white";
      titleText.fontSize = "80px";
      titleText.fontFamily = "Arial";
      titleText.fontWeight = "bold";
      titleText.outlineColor = "black";
      titleText.outlineWidth = 8;
      titleText.height = "100px";
      mainContainer.addControl(titleText);

      const subtitleText = new BABYLON.GUI.TextBlock();
      subtitleText.text = "an open source community";
      subtitleText.color = "#d3d3d3";
      subtitleText.fontSize = "26px";
      subtitleText.fontFamily = "Arial";
      subtitleText.fontStyle = "italic";
      subtitleText.outlineColor = "black";
      subtitleText.outlineWidth = 5;
      subtitleText.height = "40px";
      mainContainer.addControl(subtitleText);

      const cameraAnimDuration = 12000;
      const titleFadeInStart = 9000;
      const holdTitleDuration = 16000;
      const endSequenceTime = 18000;

      let elapsedTime = 0;
      let sequenceFinished = false;

      const startRadius = 70, endRadius = 10;
      const startBeta = 0.2, endBeta = 1.35;
      const totalSpins = Math.PI * 2.5;

      // PERFORMANCE OPTIMIZATION: Combined everything into a single render loop
      const renderObserver = scene.onBeforeRenderObservable.add(() => {
        let dt = engine.getDeltaTime();
        let dtSec = dt * 0.001;
        elapsedTime += dt;

        // --- 1. FIREFLY AGENT UPDATES ---
        if (hasNavMesh) {
          for(let i = 0; i < agentDatas.length; i++) {
            var ag = agentDatas[i];
            if (!ag || !ag.mesh) continue;
            ag.ttc -= dt;
            ag.mesh.position = crowd.getAgentPosition(ag.idx);
            let vel = crowd.getAgentVelocity(ag.idx);
            crowd.getAgentNextTargetPathToRef(ag.idx, ag.target);
            if (vel.length() > 0.01) {
              vel.normalize();
              ag.mesh.rotation.y += (Math.atan2(vel.x, vel.z) - ag.mesh.rotation.y) * 0.05;
            }
            if (BABYLON.Vector3.Distance(ag.mesh.position, ag.target) < 0.1 || ag.ttc < 0) {
              ag.target = randomGoto(i); ag.ttc = Math.random() * RANDOM_TARGET_CHANGE_RANGE_MS + MIN_TARGET_CHANGE_TIME_MS;
            }
          }
        } else {
          // Simple random-walk fallback (used when navmesh/WASM is unavailable)
          for (let i = 0; i < simpleFireflies.length; i++) {
            const ff = simpleFireflies[i];
            if (!ff || !ff.mesh) continue;
            ff.ttc -= dt;
            const dx = ff.target.x - ff.mesh.position.x;
            const dz = ff.target.z - ff.mesh.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > SIMPLE_MOVE_ARRIVE_THRESHOLD) {
              const speed = 1.5 * dtSec;
              ff.mesh.position.x += (dx / dist) * speed;
              ff.mesh.position.z += (dz / dist) * speed;
              ff.mesh.rotation.y += (Math.atan2(dx, dz) - ff.mesh.rotation.y) * 0.05;
            }
            if (dist < SIMPLE_MOVE_ARRIVE_THRESHOLD || ff.ttc < 0) {
              ff.target = getRandomPos();
              ff.ttc = Math.random() * RANDOM_TARGET_CHANGE_RANGE_MS + MIN_TARGET_CHANGE_TIME_MS;
            }
          }
        }

        // --- 2. CINEMATIC SEQUENCE ---
        if (sequenceFinished) return;

        if (elapsedTime <= cameraAnimDuration) {
          let progress = elapsedTime / cameraAnimDuration;
          let ease = 1 - Math.pow(1 - progress, 4);

          camera.radius = startRadius - ((startRadius - endRadius) * ease);
          camera.beta = startBeta + ((endBeta - startBeta) * ease);
          camera.alpha = totalSpins * ease;
        } else {
          camera.alpha += 0.0001 * dt;
        }

        if (elapsedTime > titleFadeInStart && elapsedTime <= holdTitleDuration) {
          let fadeProgress = (elapsedTime - titleFadeInStart) / (cameraAnimDuration - titleFadeInStart);
          overlay.alpha = Math.min(1, fadeProgress);
        }

        if (elapsedTime > cameraAnimDuration && elapsedTime <= holdTitleDuration) {
          let scale = 1 + Math.sin(elapsedTime * 0.002) * 0.02;
          mainContainer.scaleX = scale;
          mainContainer.scaleY = scale;
        }

        // --- 3. FADE TO BLACK ---
        if (elapsedTime > holdTitleDuration) {
          let fadeToBlackProgress = (elapsedTime - holdTitleDuration) / (endSequenceTime - holdTitleDuration);
          fadeToBlackProgress = Math.min(1, Math.max(0, fadeToBlackProgress));
          // Background goes to solid black (alpha 1)
          overlay.background = `rgba(0, 0, 0, ${0.75 + (0.25 * fadeToBlackProgress)})`;
          // Text fades out
          mainContainer.alpha = 1 - fadeToBlackProgress;

          if (elapsedTime >= endSequenceTime) {
            sequenceFinished = true;
            // Signal the parent frame that the animation is complete
            try { window.parent.postMessage("animationComplete", window.location.origin); } catch (e) { console.warn("[loading.html] Failed to signal animation complete:", e); }
          }
        }
      });
      return scene;
    }

    // Bootstrap: create engine immediately so Babylon warms up behind the overlay.
    const _canvas = document.getElementById("renderCanvas");
    (async function () {
      const preLoader = document.getElementById("preLoader");

      // ── Engine + scene: start IMMEDIATELY (parallel with pre-loader) ──────────
      // Prefer WebGPU; fall back to WebGL2/WebGL1 when WebGPU is unavailable.
      // Kicking this off now – before awaiting the spot fetch – means shader
      // compilation and asset loading happen during the overlay display window
      // rather than after it, so the first visible frame is fully rendered.
      const enginePromise = (async function () {
        const webgpuSupported = await BABYLON.WebGPUEngine.IsSupportedAsync;
        let engine;
        if (webgpuSupported) {
          engine = new BABYLON.WebGPUEngine(_canvas, { antialias: true });
          await engine.initAsync();
        } else {
          engine = new BABYLON.Engine(_canvas, /* antialias= */ true, {
            preserveDrawingBuffer: false,
            stencil: true,
            disableWebGL2Support: false
          });
        }
        // Expose engine globally so createScene (which references it as a free
        // var resolved through the global scope) can use it.
        window.engine = engine;
        return engine;
      })();

      // Chain scene creation immediately after the engine is ready.
      const scenePromise = enginePromise.then(function () {
        return createScene();
      }).catch(function (err) {
        console.error("[loading.html] Scene creation failed:", err);
        return null;
      });

      // Start the render loop as soon as the scene resolves so the GPU pipeline
      // is warm when the overlay fades out – the reveal is seamless.
      scenePromise.then(function (scene) {
        if (!scene) return;
        window.engine.runRenderLoop(function () { scene.render(); });
        window.addEventListener("resize", function () { window.engine.resize(); });
      });

      // ── Pre-loader phase (runs concurrently with engine + scene init) ─────────
      // Wait for the spot-file fetch started before scripts loaded.
      const spotHtml = await window.__spotFetch;

      if (spotHtml && preLoader) {
        try {
          const parser = new DOMParser();
          const spotDoc = parser.parseFromString(spotHtml, "text/html");
          // Extract only the #spotContent element to avoid pulling in the
          // spot page's own <style> and outer wrapper styles.
          const spotContent = spotDoc.getElementById("spotContent");
          if (spotContent) {
            preLoader.innerHTML = spotContent.outerHTML;
            // Ensure all links in the injected content open in a new tab
            // so users are never navigated away from the current page.
            preLoader.querySelectorAll("a[href]").forEach(function (a) {
              a.target = "_blank";
              a.rel = "noopener noreferrer";
            });
          }
        } catch (parseErr) {
          console.warn("[loading.html] Could not parse spot file:", parseErr);
        }
      }

      // Wait for the remaining portion of the 4-6 s delay AND for the scene to
      // finish loading before removing the overlay.  Whichever takes longer wins:
      // the full delay is always honoured, but if the scene is still loading we
      // hold the overlay so the reveal is never a blank canvas.
      const elapsed   = Date.now() - window.__plStart;
      const remaining = Math.max(0, window.__plDelay - elapsed);
      await Promise.all([
        new Promise(function (resolve) { setTimeout(resolve, remaining); }),
        scenePromise,
      ]);

      // Fade out and remove the pre-loader.  The scene is already rendering
      // behind the overlay, so the transition to 3-D is seamless.
      if (preLoader) {
        preLoader.classList.add("pl-fade-out");
        await new Promise(function (resolve) { setTimeout(resolve, 700); });
        preLoader.style.display = "none";
      }

      const scene = await scenePromise;
      if (!scene) {
        console.error("[loading.html] Scene creation failed – render loop not started.");
        return;
      }
    })().catch(function (err) {
      console.error("[loading.html] Fatal init error:", err);
      // Show a minimal error message so the user knows something went wrong
      if (_canvas) {
        const ctx = _canvas.getContext("2d");
        if (ctx) {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, _canvas.width, _canvas.height);
          ctx.fillStyle = "#f55";
          ctx.font = "bold 18px Arial";
