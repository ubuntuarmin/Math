<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #renderCanvas {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script>
    // Pure Canvas 2D loading animation — no external dependencies.
    // Timing mirrors the original Babylon.js scene exactly:
    //   0 – 12 s  cinematic camera zoom-in (simulated with a perspective zoom)
    //   9 – 16 s  title overlay fades in
    //  12 – 16 s  title gently pulses
    //  16 – 18 s  fade to solid black, text fades out
    //      18 s   postMessage('animationComplete') → parent hides this loader

    const canvas = document.getElementById("renderCanvas");
    const ctx    = canvas.getContext("2d");

    const cameraAnimDuration = 12000;
    const titleFadeInStart   = 9000;
    const holdTitleDuration  = 16000;
    const endSequenceTime    = 18000;

    function resize() {
      canvas.width  = canvas.clientWidth  || window.innerWidth;
      canvas.height = canvas.clientHeight || window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    // ── Stars ────────────────────────────────────────────────────────────────
    const STAR_COUNT = 220;
    const stars = Array.from({ length: STAR_COUNT }, () => ({
      x:       Math.random(),
      y:       Math.random() * 0.65,
      r:       Math.random() * 1.4 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
    }));

    // ── Fireflies (30 agents, matching original AGENT_COUNT) ─────────────────
    const FIREFLY_COUNT = 30;
    const fireflies = Array.from({ length: FIREFLY_COUNT }, () => ({
      x:          Math.random(),   // normalised [0,1]
      y:          0.35 + Math.random() * 0.45,
      tx:         Math.random(),
      ty:         0.35 + Math.random() * 0.45,
      speed:      0.00015 + Math.random() * 0.0002,
      glowR:      5 + Math.random() * 8,
      pulse:      Math.random() * Math.PI * 2,
      pulseSpeed: 0.025 + Math.random() * 0.04,
      ttc:        Math.random() * 8000,
    }));

    // ── Ruins geometry (drawn once per frame in world-space) ─────────────────
    function drawRuins(w, h, zoom) {
      // zoom goes 0 → 1 over cameraAnimDuration; we scale the scene slightly
      const s  = 1 + zoom * 0.35;
      const cx = w * 0.5, cy = h;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(s, s);
      ctx.translate(-cx, -cy);

      const stone = "rgba(18,14,10,0.97)";

      // Ground plane
      ctx.fillStyle = stone;
      ctx.fillRect(0, h * 0.76, w, h * 0.24);

      // Far ruins on horizon (drawn first so they sit behind)
      ctx.fillStyle = "rgba(14,11,8,0.82)";
      [[0.18,0.64,0.022,0.12],[0.74,0.62,0.025,0.14],[0.58,0.66,0.018,0.10],[0.38,0.68,0.015,0.08]].forEach(([rx,ry,rw,rh]) => {
        ctx.fillRect(w*rx, h*ry, w*rw, h*rh);
      });

      ctx.fillStyle = stone;

      // Left column + capital
      ctx.fillRect(w*0.10, h*0.44, w*0.055, h*0.32);
      ctx.fillRect(w*0.09, h*0.42, w*0.075, h*0.035);

      // Right column + capital
      ctx.fillRect(w*0.845, h*0.44, w*0.055, h*0.32);
      ctx.fillRect(w*0.835, h*0.42, w*0.075, h*0.035);

      // Centre archway
      ctx.beginPath();
      ctx.moveTo(w*0.285, h*0.76);
      ctx.lineTo(w*0.285, h*0.54);
      ctx.arc(w*0.5, h*0.54, w*0.215, Math.PI, 0, false);
      ctx.lineTo(w*0.715, h*0.76);
      ctx.closePath();
      ctx.fill();

      // Rubble blocks in foreground
      [[0.04,0.73,0.11,0.055],[0.87,0.71,0.09,0.07],[0.23,0.745,0.07,0.038],[0.61,0.72,0.09,0.055],[0.50,0.755,0.055,0.028]].forEach(([rx,ry,rw,rh]) => {
        ctx.fillRect(w*rx, h*ry, w*rw, h*rh);
      });

      ctx.restore();
    }

    // ── Ease function (quartic out) ───────────────────────────────────────────
    function easeOut4(t) { return 1 - Math.pow(1 - t, 4); }

    // ── Main render loop ──────────────────────────────────────────────────────
    let startTime        = null;
    let sequenceFinished = false;
    let rafId            = null;

    function frame(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const w = canvas.width, h = canvas.height;

      const camProg  = Math.min(1, elapsed / cameraAnimDuration);
      const camEased = easeOut4(camProg);

      // Subtle pan offset to simulate camera alpha rotation (horizontal drift)
      const panX = Math.sin(camEased * Math.PI * 2.5) * w * 0.04;

      // ── Sky gradient ──────────────────────────────────────────────────────
      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.76);
      sky.addColorStop(0,   "#01030a");
      sky.addColorStop(0.45,"#04080f");
      sky.addColorStop(0.75,"#080b14");
      sky.addColorStop(1,   "#110e06");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // ── Stars ─────────────────────────────────────────────────────────────
      const t = elapsed * 0.001;
      const starAlpha = Math.min(1, elapsed / 3000);
      for (const s of stars) {
        const tw = 0.5 + 0.5 * Math.sin(s.twinkle + t * 1.4);
        ctx.beginPath();
        ctx.arc(s.x * w + panX * 0.3, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(195,210,255,${(0.35 + tw * 0.65) * starAlpha})`;
        ctx.fill();
      }

      // ── Atmospheric warm glow near ground ─────────────────────────────────
      const glow = ctx.createRadialGradient(w*0.5 + panX, h*0.76, 0, w*0.5 + panX, h*0.76, w*0.55);
      glow.addColorStop(0,   `rgba(90,55,18,${0.18 * camEased})`);
      glow.addColorStop(0.5, `rgba(45,28,9,${0.09 * camEased})`);
      glow.addColorStop(1,   "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      // ── Ruins ─────────────────────────────────────────────────────────────
      ctx.save();
      ctx.translate(panX, 0);
      drawRuins(w, h, camEased);
      ctx.restore();

      // ── Fireflies ─────────────────────────────────────────────────────────
      const ffAppear = Math.min(1, elapsed / 5000);
      for (const ff of fireflies) {
        ff.ttc -= 16;
        if (ff.ttc <= 0) {
          ff.tx  = Math.random();
          ff.ty  = 0.35 + Math.random() * 0.40;
          ff.ttc = 3000 + Math.random() * 8000;
        }
        const dx = ff.tx - ff.x, dy = ff.ty - ff.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const step = Math.min(dist, ff.speed);
        ff.x += (dx / dist) * step;
        ff.y += (dy / dist) * step;
        ff.pulse += ff.pulseSpeed;

        const brightness = (0.55 + 0.45 * Math.sin(ff.pulse)) * ffAppear;
        const fx = (ff.x * w) + panX * 0.6;
        const fy =  ff.y * h;
        const gr = ff.glowR;

        const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, gr * 3.5);
        g.addColorStop(0,   `rgba(255,200,70,${brightness * 0.85})`);
        g.addColorStop(0.35,`rgba(255,140,20,${brightness * 0.30})`);
        g.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.beginPath();
        ctx.arc(fx, fy, gr * 3.5, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(fx, fy, gr * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,245,200,${brightness})`;
        ctx.fill();
      }

      // ── Dark overlay (for title card, matches original overlay.alpha logic) ─
      let overlayA = 0, textA = 1;

      if (elapsed > titleFadeInStart && elapsed <= holdTitleDuration) {
        const fp = (elapsed - titleFadeInStart) / (cameraAnimDuration - titleFadeInStart);
        overlayA = Math.min(0.75, 0.75 * Math.min(1, fp));
      }

      if (elapsed > holdTitleDuration) {
        const ftb = Math.min(1, Math.max(0, (elapsed - holdTitleDuration) / (endSequenceTime - holdTitleDuration)));
        overlayA = 0.75 + 0.25 * ftb;
        textA    = 1 - ftb;
      }

      if (overlayA > 0) {
        ctx.fillStyle = `rgba(0,0,0,${overlayA})`;
        ctx.fillRect(0, 0, w, h);
      }

      // ── Title / subtitle ──────────────────────────────────────────────────
      if (elapsed > titleFadeInStart) {
        let titleProg;
        if (elapsed <= holdTitleDuration) {
          titleProg = Math.min(1, (elapsed - titleFadeInStart) / (cameraAnimDuration - titleFadeInStart));
        } else {
          titleProg = 1;
        }
        const alpha = titleProg * textA;

        // Pulse scale (matches original mainContainer scale animation)
        let sc = 1;
        if (elapsed > cameraAnimDuration && elapsed <= holdTitleDuration) {
          sc = 1 + Math.sin(elapsed * 0.002) * 0.02;
        }

        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.scale(sc, sc);

        const titleSize = Math.round(Math.min(80, w * 0.105));
        ctx.font         = `bold ${titleSize}px Arial`;
        ctx.textAlign    = "center";
        ctx.textBaseline = "middle";

        ctx.lineWidth   = 16;
        ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
        ctx.strokeText("Math-Katy", 0, -titleSize * 0.5);
        ctx.fillStyle   = `rgba(255,255,255,${alpha})`;
        ctx.fillText("Math-Katy", 0, -titleSize * 0.5);

        const subSize = Math.round(Math.min(26, w * 0.034));
        ctx.font        = `italic ${subSize}px Arial`;
        ctx.lineWidth   = 10;
        ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
        ctx.strokeText("an open source community", 0, titleSize * 0.65);
        ctx.fillStyle   = `rgba(211,211,211,${alpha})`;
        ctx.fillText("an open source community", 0, titleSize * 0.65);

        ctx.restore();
      }

      // ── Sequence finished ─────────────────────────────────────────────────
      if (elapsed >= endSequenceTime && !sequenceFinished) {
        sequenceFinished = true;
        try { window.parent.postMessage("animationComplete", "*"); } catch (_) {}
        return; // stop the loop — screen is solid black, content will show
      }

      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);
  </script>
</body>
</html>
